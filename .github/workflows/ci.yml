name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    # Type checks, shell syntax and manifest parsing need no Xcode.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Swift
        uses: tryswift/setup-swift@v1
        with:
          swift-version: '6.4.2'

      # `bash -n a.sh b.sh` checks only the first file (the rest become
      # arguments), so check each file on its own.
      - name: Type-check Swift scripts
        run: for f in scripts/*.swift; do swiftc -typecheck "$f" || exit 1; done

      - name: Check shell syntax
        run: for f in scripts/*.sh; do bash -n "$f" || exit 1; done

      - name: Verify Package.swift parses
        run: swift package dump-package > /dev/null
