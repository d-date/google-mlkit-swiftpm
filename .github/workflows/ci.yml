name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.13'

      # `ruby -c a.rb b.rb` and `bash -n a.sh b.sh` check only the first file
      # (the rest become arguments), so check each file on its own.
      - name: Check Ruby syntax
        run: for f in scripts/*.rb; do ruby -c "$f" || exit 1; done

      - name: Check shell syntax
        run: for f in scripts/*.sh; do bash -n "$f" || exit 1; done

      - name: Verify Package.swift parses
        run: swift package dump-package > /dev/null
