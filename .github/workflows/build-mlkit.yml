name: Build MLKit XCFrameworks

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to build (major.minor follow ML Kit, patch counts wrapper releases, e.g. 9.0.4)'
        required: true
        type: string
      create_release:
        description: 'Create GitHub release after build'
        required: true
        type: boolean
        default: true

env:
  # Branch, tag or commit of https://github.com/d-date/swiftpods to build.
  # TODO: pin a swiftpods release tag once one is published.
  SWIFTPODS_REF: main
  VERSION: ${{ inputs.version }}

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Xcode supplies the iOS SDKs and build tools.
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # swiftpods needs Swift 6.4, newer than the Swift in macos-26's Xcode.
      # The action also exports TOOLCHAINS, so swiftpods' `xcrun swiftc` for
      # Podfile.swift resolves to this toolchain along with the macOS SDK.
      - name: Set up Swift
        uses: tryswift/setup-swift@v1
        with:
          swift-version: '6.4.2'

      - name: Validate version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::invalid version '$VERSION' (expected X.Y.Z[-PRERELEASE])"
            exit 1
          fi

      - name: Build swiftpods
        run: |
          src="$RUNNER_TEMP/swiftpods"
          git init --quiet "$src"
          git -C "$src" fetch --quiet --depth 1 https://github.com/d-date/swiftpods.git "$SWIFTPODS_REF"
          git -C "$src" checkout --quiet FETCH_HEAD
          echo "swiftpods $(git -C "$src" rev-parse HEAD)"
          swift build -c release --product swiftpods --package-path "$src"
          echo "SWIFTPODS=$(swift build -c release --show-bin-path --package-path "$src")/swiftpods" >> "$GITHUB_ENV"

      - name: Build the XCFrameworks and Package.swift
        run: '"$SWIFTPODS" package --version "$VERSION"'

      - name: Verify Package.swift
        run: swift package dump-package > /dev/null

      - name: Create commit
        if: inputs.create_release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Podfile.swift Podfile.lock Package.swift Sources/Common/export.swift
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Release $VERSION

          Generated by \`swiftpods package --version $VERSION\`.

          🤖 Generated with GitHub Actions"
          fi

      - name: Create or update tag
        if: inputs.create_release
        run: |
          # Delete existing tag if it exists (for release updates)
          if git tag -l | grep -qx "$VERSION"; then
            git tag -d "$VERSION"
            git push origin ":refs/tags/$VERSION" || true
          fi
          git tag "$VERSION"

      - name: Push changes and tag
        if: inputs.create_release
        run: |
          git push origin HEAD:main
          git push origin "$VERSION" --force

      - name: Create release and upload assets
        if: inputs.create_release
        run: scripts/release.sh --skip-package "$VERSION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload XCFramework artifacts
        if: ${{ !inputs.create_release }}
        uses: actions/upload-artifact@v7
        with:
          name: xcframeworks-${{ inputs.version }}
          path: |
            build/distribution/*.xcframework.zip
            build/distribution/*.bundle.zip
            build/distribution/Package.swift
          retention-days: 30

      - name: Comment on related issue
        if: inputs.create_release
        uses: actions/github-script@v9
        with:
          script: |
            const version = process.env.VERSION;

            // Find the issue for this version
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['mlkit-update']
            });

            const issue = issues.data.find(i => i.title.includes(version));

            if (issue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Successfully built and released version ${version}!\n\nRelease: https://github.com/${{ github.repository }}/releases/tag/${version}`
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }
